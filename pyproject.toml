[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ue4-mcp-server"
version = "0.1.0"
description = "MCP Server for Unreal Engine 4/5 — let AI assistants control your editor"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "lsl" }]
keywords = ["mcp", "unreal-engine", "ue4", "ue5", "ai", "editor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mcp>=1.0.0"]

[project.urls]
Homepage = "https://github.com/lsl/ue4-mcp-server"
Repository = "https://github.com/lsl/ue4-mcp-server"

[project.scripts]
ue4-mcp = "ue4_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ue4_mcp"]
